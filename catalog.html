<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catalog — Krishna Priya Fashion</title>
<meta name="description" content="Browse our full edit of ethnic wear, western styles, nightwear and accessories at Krishna Priya Fashion, Jaipur." />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      cream:'#FDFBF7', beige:'#F1E9DD', sand:'#E5D9C6', rose:'#C9A6A0', 'rose-deep':'#A87A72',
      terracotta:'#B96E4B', 'terracotta-deep':'#8F5232', gold:'#B08D57', 'gold-soft':'#D4B483',
      charcoal:'#1A1A1A', 'charcoal-soft':'#3D3A36', muted:'#8A8278',
    },
    fontFamily: { display:['"Playfair Display"','serif'], body:['Inter','sans-serif'] },
  }},
};
</script>
<link rel="stylesheet" href="css/global.css" />
<link rel="stylesheet" href="css/catalog.css" />
</head>
<body class="bg-cream text-charcoal">

<div id="header-slot"></div>

<div class="bg-beige border-b border-sand">
  <div class="max-w-7xl mx-auto px-6 py-12 text-center">
    <p class="text-terracotta tracking-[0.25em] uppercase text-xs mb-3">Shop the Collection</p>
    <h1 class="font-display text-4xl sm:text-5xl">Catalog</h1>
    <p class="text-charcoal-soft mt-3 max-w-xl mx-auto">Browse our full edit of ethnic wear, western styles, nightwear and accessories.</p>
  </div>
</div>

<div class="max-w-7xl mx-auto px-6 py-10">
  <div class="flex flex-col lg:flex-row gap-4 lg:items-center justify-between mb-8">
    <div class="flex flex-wrap gap-2" id="categoryFilters">
      <button onclick="setCategory('All')" data-cat="All" class="cat-btn px-4 py-2 rounded-full text-sm border border-sand bg-cream hover:bg-beige transition">All</button>
      <button onclick="setCategory('Ethnic Wear')" data-cat="Ethnic Wear" class="cat-btn px-4 py-2 rounded-full text-sm border border-sand bg-cream hover:bg-beige transition">Ethnic Wear</button>
      <button onclick="setCategory('Western Wear')" data-cat="Western Wear" class="cat-btn px-4 py-2 rounded-full text-sm border border-sand bg-cream hover:bg-beige transition">Western Wear</button>
      <button onclick="setCategory('Nightwear')" data-cat="Nightwear" class="cat-btn px-4 py-2 rounded-full text-sm border border-sand bg-cream hover:bg-beige transition">Nightwear</button>
      <button onclick="setCategory('Cosmetics & Jewelry')" data-cat="Cosmetics & Jewelry" class="cat-btn px-4 py-2 rounded-full text-sm border border-sand bg-cream hover:bg-beige transition">Cosmetics &amp; Jewelry</button>
    </div>
    <div class="flex items-center gap-3">
      <label class="text-sm text-muted">Sort</label>
      <select id="sortSelect" onchange="renderCatalog()" class="bg-cream border border-sand rounded-full px-4 py-2 text-sm">
        <option value="featured">Featured</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
        <option value="name">Name: A–Z</option>
      </select>
    </div>
  </div>
  <p id="catalogCount" class="text-sm text-muted mb-6"></p>
  <div id="catalogGrid" class="grid grid-cols-2 lg:grid-cols-4 gap-5 sm:gap-7"></div>
  <div id="catalogEmpty" class="hidden text-center py-20 text-muted">
    <i data-lucide="search-x" class="w-10 h-10 mx-auto mb-4"></i>
    <p>No pieces match your search.</p>
  </div>
</div>

<div id="footer-slot"></div>
<div id="overlay-slot"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/data.js"></script>
<script src="js/shared.js"></script>
<script src="js/catalog.js"></script>
</body>
</html>
